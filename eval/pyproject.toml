[project]
name = "redteam-eval"
version = "0.1.0"
description = "Reproducible evaluation harness for AutoRedTeam (attacker/target/judge episode runner + leak oracle)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.35.1",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
redteam-eval = "redteam_eval.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redteam_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
